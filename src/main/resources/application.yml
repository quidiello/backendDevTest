spring:
  application:
    name: similar-products
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  cache:
    cache-names: similar-ids, product-details
    caffeine:
      spec: maximumSize=100000,expireAfterWrite=5m

server:
  port: 5000

product-api:
  base-url: http://localhost:3001
  connect-timeout: 5s
  read-timeout: 6s
  max-concurrent-requests: 600
  max-wait-for-slot: 1s
  failure-ttl: 30s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
