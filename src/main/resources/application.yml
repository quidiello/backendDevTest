spring:
  application:
    name: similar-products
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 5000

product-api:
  base-url: http://localhost:3001
  connect-timeout: 5s
  read-timeout: 60s
  max-concurrent-requests: 300
  max-wait-for-slot: 1s

management:
  endpoints:
    web:
      exposure:
        include: health, info
